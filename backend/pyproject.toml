[project]
name = "mystock-backend"
version = "0.1.0"
description = "MyStock 股票分析平台后端"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # 数据库
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # 配置管理
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # 任务队列
    "celery>=5.3.0",
    "redis>=5.0.0",

    # 数据采集
    "akshare>=1.14.0",
    "yfinance>=0.2.40",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",

    # 技术分析
    "pandas>=2.1.0",
    "pandas-ta>=0.3.14b0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",

    # AI 分析
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "openai>=1.50.0",
    "anthropic>=0.34.0",

    # 爬虫
    "playwright>=1.47.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",

    # PDF 处理（年报提取）
    "pymupdf>=1.24.0",

    # 工具
    "python-dotenv>=1.0.0",
    "tenacity>=8.5.0",
    "pytz>=2024.1",

    # 资讯流水线
    "simhash>=2.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
