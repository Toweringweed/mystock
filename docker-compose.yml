services:
  postgres:
    image: postgres:15-alpine
    container_name: mystock-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mystock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mystock123}
      POSTGRES_DB: ${POSTGRES_DB:-mystock_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mystock} -d ${POSTGRES_DB:-mystock_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mystock-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mystock-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mystock}:${POSTGRES_PASSWORD:-mystock123}@postgres:5432/${POSTGRES_DB:-mystock_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1,postgres,redis
    env_file:
      - .env
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - annual_reports:/app/data/annual_reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run fastapi dev app/main.py --host 0.0.0.0 --port 8000
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mystock-celery-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mystock}:${POSTGRES_PASSWORD:-mystock123}@postgres:5432/${POSTGRES_DB:-mystock_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_WORKER_RUNNING=true
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1,postgres,redis
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - annual_reports:/app/data/annual_reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mystock-celery-beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mystock}:${POSTGRES_PASSWORD:-mystock123}@postgres:5432/${POSTGRES_DB:-mystock_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_WORKER_RUNNING=true
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1,postgres,redis
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      - celery-worker
    command: uv run celery -A app.tasks.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: mystock-frontend
    working_dir: /app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8010
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "3010:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  annual_reports:
  backend_venv:
